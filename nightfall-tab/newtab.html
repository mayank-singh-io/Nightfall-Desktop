<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New tab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-sky="night">
  <canvas id="sky" aria-hidden="true"></canvas>

  <svg class="ridges" viewBox="0 0 1600 360" preserveAspectRatio="none" aria-hidden="true">
    <path style="fill: var(--ridge1)" d="M0 210 L180 170 L330 190 L520 120 L640 140 L800 60 L930 120 L1090 100 L1260 150 L1430 110 L1600 160 L1600 360 L0 360 Z"/>
    <path style="fill: var(--ridge2)" d="M0 260 L220 225 L400 245 L600 205 L820 240 L1000 210 L1220 245 L1420 220 L1600 240 L1600 360 L0 360 Z"/>
    <path style="fill: var(--ridge3)" d="M0 310 L260 290 L520 305 L780 285 L1060 300 L1320 288 L1600 300 L1600 360 L0 360 Z"/>
  </svg>

  <canvas id="weather" aria-hidden="true"></canvas>

  <div id="moon-label" hidden></div>

  <main>
    <h1 id="clock" aria-live="off">--:--</h1>
    <p id="greeting">Good evening</p>

    <form id="search" role="search">
      <label class="sr-only" for="q">Search the web</label>
      <input id="q" type="search" placeholder="Search the web" autocomplete="off">
    </form>

    <nav id="links" aria-label="Your sites"></nav>
  </main>

  <p id="thought"></p>

  <div id="notes-wrap" class="pos-bl">
    <button id="notes-mini" type="button" aria-label="Open today's notes"></button>
    <section id="notes" hidden aria-label="Today's notes">
      <ul id="todo-list"></ul>
      <form id="todo-form">
        <label class="sr-only" for="todo-text">New task</label>
        <input id="todo-text" placeholder="Add a task" autocomplete="off" maxlength="120">
      </form>
      <p class="error" id="todo-error" role="alert"></p>
      <label class="sr-only" for="notes-text">Notes</label>
      <textarea id="notes-text" rows="2" placeholder="A note for today"></textarea>
      <button id="close-notes" type="button">Done</button>
    </section>
  </div>

  <button id="make-meteors" class="corner-btn" aria-label="Start a meteor shower" title="Start a meteor shower (M)">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M4 4l9 9M8 3l7 7M3 8l7 7"/><circle cx="17" cy="17" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>

  <button id="open-settings" class="corner-btn" aria-label="Customize">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path fill="none" stroke="currentColor" stroke-width="1.6" d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
  </button>

  <aside id="settings" hidden aria-labelledby="settings-title">
    <h2 id="settings-title">Customize</h2>

    <fieldset>
      <legend>Your sites</legend>
      <ul id="link-list"></ul>
      <div class="add-row">
        <input id="new-name" placeholder="Name" aria-label="Site name">
        <input id="new-url" placeholder="youtube.com" aria-label="Site address">
        <button id="add-link" type="button">Add site</button>
      </div>
      <p class="error" id="link-error" role="alert"></p>
    </fieldset>

    <fieldset>
      <legend>Clock</legend>
      <label><input type="checkbox" id="opt-24h"> Use 24-hour time</label>
    </fieldset>

    <fieldset>
      <legend>Sky</legend>
      <label for="opt-sky">Sky color</label>
      <select id="opt-sky">
        <option value="auto">Follow the time of day</option>
        <option value="night">Always night</option>
        <option value="dawn">Always dawn</option>
        <option value="day">Always day</option>
        <option value="dusk">Always dusk</option>
      </select>
      <label for="opt-moon">Moon</label>
      <select id="opt-moon">
        <option value="auto">Tonight's real phase</option>
        <option value="crescent">Always crescent</option>
        <option value="half">Always half moon</option>
        <option value="gibbous">Always gibbous</option>
        <option value="full">Always full moon</option>
        <option value="off">Hide the moon</option>
      </select>
      <p class="hint" id="moon-status"></p>
      <label><input type="checkbox" id="opt-shooting"> Show shooting stars</label>
      <label for="opt-shower-freq">Meteor showers</label>
      <select id="opt-shower-freq">
        <option value="off">Off</option>
        <option value="rare">Rarely (about once an hour)</option>
        <option value="sometimes">Sometimes (every 10 to 15 minutes)</option>
        <option value="often">Often (every few minutes)</option>
      </select>
      <label for="opt-shower-size">Shower size</label>
      <select id="opt-shower-size">
        <option value="gentle">Gentle (5 to 8 meteors)</option>
        <option value="medium">Medium (10 to 15 meteors)</option>
        <option value="dramatic">Dramatic (25 or more)</option>
      </select>
      <button id="preview-shower" type="button">Preview a meteor shower</button>
    </fieldset>

    <fieldset>
      <legend>Weather</legend>
      <label for="opt-weather">Weather in the sky</label>
      <select id="opt-weather">
        <option value="auto">Match the weather outside</option>
        <option value="clear">Always clear</option>
        <option value="rain">Always rain</option>
        <option value="storm">Always storm</option>
        <option value="snow">Always snow</option>
        <option value="fog">Always fog</option>
      </select>
      <div class="add-row">
        <input id="city" placeholder="Your city, like Lucknow" aria-label="Your city">
        <button id="save-city" type="button">Save city</button>
      </div>
      <p class="hint" id="weather-status"></p>
    </fieldset>

    <fieldset>
      <legend>Thoughts</legend>
      <label><input type="checkbox" id="opt-thought"> Show thoughts</label>
      <label><input type="checkbox" id="opt-rotate"> Change to a new one every minute</label>
    </fieldset>

    <fieldset>
      <legend>Notes</legend>
      <label for="opt-notes-style">When closed, show</label>
      <select id="opt-notes-style">
        <option value="tiny">A tiny list of your tasks</option>
        <option value="count">Just a count, like "2 tasks"</option>
      </select>
      <label for="opt-notes-pos">Position</label>
      <select id="opt-notes-pos">
        <option value="pos-bl">Bottom left</option>
        <option value="pos-tl">Top left</option>
        <option value="pos-us">Under the search bar</option>
      </select>
      <p class="hint">Finished tasks clear at midnight. Unfinished ones carry over.</p>
    </fieldset>

    <fieldset>
      <legend>Constellations</legend>
      <label><input type="checkbox" id="opt-real-constellations"> Show real constellations now and then</label>
      <p class="hint">Click stars to connect them. Click empty sky or press Esc to finish a constellation.</p>
      <button id="clear-constellations" type="button">Clear my constellations</button>
    </fieldset>

    <button id="close-settings" type="button">Done</button>
  </aside>

  <script src="thoughts.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
